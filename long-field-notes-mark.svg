<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Long Field Notes">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#1c4a42"/>
      <stop offset="1" stop-color="#0f2f2b"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="160" fill="url(#glow)"/>
  <!-- notebook page -->
  <g transform="translate(212 196)">
    <rect x="0" y="0" width="600" height="632" rx="22" fill="#f4efe7"/>
    <rect x="0" y="0" width="600" height="632" rx="22" fill="none" stroke="#e7a755" stroke-width="6"/>
    <!-- margin rule -->
    <line x1="92" y1="0" x2="92" y2="632" stroke="#e7a755" stroke-width="4" opacity=".9"/>
    <!-- horizon with sun -->
    <path d="M136 170 A76 76 0 0 1 288 170" fill="#e7a755"/>
    <line x1="126" y1="170" x2="540" y2="170" stroke="#0f2f2b" stroke-width="10" stroke-linecap="round"/>
    <!-- field furrows receding -->
    <line x1="126" y1="262" x2="540" y2="262" stroke="#0f2f2b" stroke-width="7" stroke-linecap="round"/>
    <line x1="126" y1="346" x2="500" y2="346" stroke="#0f2f2b" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    <line x1="126" y1="430" x2="456" y2="430" stroke="#0f2f2b" stroke-width="7" stroke-linecap="round" opacity=".6"/>
    <line x1="126" y1="514" x2="400" y2="514" stroke="#0f2f2b" stroke-width="7" stroke-linecap="round" opacity=".4"/>
  </g>
  <!-- wordmark -->
  <text x="512" y="930" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#f4efe7" letter-spacing="1">Long Field Notes</text>
</svg>
